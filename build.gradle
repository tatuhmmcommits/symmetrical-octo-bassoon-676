plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

sourceSets {
    main {
        java.srcDirs = ['main/java']
        resources.srcDirs = ['main/resources']
    }
}

sourceSets {
    main {
        java.srcDirs = ['main/java']
        resources.srcDirs = ['main/resources']
    }
}
    
base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the Minecraft and Fabric repositories automatically.

	// Trinkets (accessory slots) and the Cardinal Components library it is built on
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Ladysnake Mods"
		url = "https://maven.ladysnake.org/releases"
	}
	// Where the author of Trinkets publishes today; only asked for his own artifacts, and only if the repository
	// above does not have the version we want.
	maven {
		name = "Sleeping Town"
		url = "https://repo.sleeping.town/"
		content {
			includeGroup "dev.emi"
		}
	}
}

loom {
	// Client-only code lives in src/client so a dedicated server never loads it.
	splitEnvironmentSourceSets()

	mods {
		"charter" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Trinkets gives the Token of Absolution and the rings their slots. It is bundled into the Charter jar
	// ("jar in jar"), so nobody has to install it separately; it carries Cardinal Components with it.
	modImplementation "dev.emi:trinkets:${project.trinkets_version}"
	include("dev.emi:trinkets:${project.trinkets_version}") {
		transitive = false
	}
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}
